name: Infer eligibility (new jobs)

# Asks the model who may apply, for the recent postings the deterministic
# engine could not judge, and stores the answer in jobs.elig_signals.infer.
#
# WHY ON A SCHEDULE RATHER THAN INSIDE INGEST: the pipeline upserts with
# ignoreDuplicates, so it only ever touches a job on the run it first appears.
# Groq's free tier rate-limits these calls (measured: 7 of 20 even when run
# sequentially), so inline inference would permanently abandon roughly a third
# of exactly the rows it exists to fix. Keyed on "inference is missing"
# instead, a rate limit costs nothing but time — the row stays pending and the
# next run picks it up, so coverage converges rather than leaking.
#
# WHY 30 MINUTES AFTER INGEST: ingest runs at 06:00 and 18:00 UTC. This gives
# it time to finish so the new rows are actually there to be enriched.
#
# REQUIRED SECRETS — note GROQ_API_KEY in particular:
#   SUPABASE_URL, SUPABASE_KEY   already used by every other workflow here
#   GROQ_API_KEY                 THIS IS THE ONLY WORKFLOW THAT NEEDS IT.
#                                Nothing else in the repo calls a model from
#                                CI, so it will not already exist — create it
#                                under Settings → Secrets and variables →
#                                Actions. Without it the run exits 1 with a
#                                message naming the missing key.
#   GROQ_MODEL                   optional; falls back to llama-3.3-70b-versatile.

on:
  schedule:
    - cron: "30 6 * * *"    # after the 06:00 ingest
    - cron: "30 18 * * *"   # after the 18:00 ingest
  workflow_dispatch:
    inputs:
      days:
        description: "How far back to look for pending rows"
        default: "14"
      limit:
        description: "Max model calls this run (cost ceiling)"
        default: "300"
      all:
        description: "Ignore the date window and process the whole corpus (the backfill decision — expensive)"
        type: boolean
        default: false

# Never let two runs enrich the same rows at once.
concurrency:
  group: infer-eligibility
  cancel-in-progress: false

jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, like every other workflow here, and not lower: @supabase/
          # supabase-js constructs a RealtimeClient at createClient() time and
          # that needs a native WebSocket, which Node gained in 22. On 20 this
          # throws before a single line of our code runs.
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Infer eligibility
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          # Rate limiting, not parallelism, is the constraint here. Raising
          # these makes runs fail faster, not finish faster.
          INFER_CONCURRENCY: "2"
          INFER_PACE_MS: "1200"
        run: |
          node ingest/infer_pending.js \
            --days ${{ github.event.inputs.days || '14' }} \
            --limit ${{ github.event.inputs.limit || '300' }} \
            ${{ github.event.inputs.all == 'true' && '--all' || '' }}
