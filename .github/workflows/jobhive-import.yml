name: Jobhive Bulk Import

# Every maintained slice refreshes daily. Expanded platforms have a smaller
# new-row budget; existing owned postings refresh independently of that budget.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC / 04:00 Lagos; scheduled starts can be delayed.
  workflow_dispatch:
    inputs:
      sources:
        description: "all, blank, or comma-separated maintained ATS names"
        required: false
        default: "all"
      dry_run:
        description: "Scan and classify without database reads or writes"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: jobhive-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: sources
        run: node ingest/jobhive_plan.js
        env:
          JOBHIVE_SOURCES: ${{ inputs.sources || 'all' }}
  jobhive-import:
    needs: plan
    name: Import ${{ matrix.ats }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Independent jobs continue when a source fails, but the workflow
      # reports that failure instead of silently turning it green.
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import source
        shell: bash
        run: |
          args=("$JOBHIVE_ATS" --max-new-rows "$MAX_NEW_ROWS" --max-new-bytes "$MAX_NEW_BYTES")
          if [[ "$PREFER_CONFIRMED" == "true" ]]; then args+=(--prefer-confirmed); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run);
          elif [[ "$DRY_RUN" != "false" ]]; then echo "Invalid dry_run"; exit 1; fi
          node ingest/import_jobhive.js "${args[@]}"
        env:
          JOBHIVE_ATS: ${{ matrix.ats }}
          MAX_NEW_ROWS: ${{ matrix.max_new_rows }}
          MAX_NEW_BYTES: ${{ matrix.max_new_bytes }}
          PREFER_CONFIRMED: ${{ matrix.prefer_confirmed && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
