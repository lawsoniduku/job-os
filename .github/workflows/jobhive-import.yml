name: Jobhive Bulk Import

# Daily refresh of the five existing slices. Occasional bulk-import sources
# are not refreshed by this workflow; see docs/jobhive-audit.md.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC / 04:00 Lagos; scheduled starts can be delayed.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jobhive-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jobhive-import:
    name: Import ${{ matrix.ats }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Independent jobs continue when a source fails, but the workflow
      # reports that failure instead of silently turning it green.
      fail-fast: false
      max-parallel: 2
      matrix:
        ats: [icims, phenom, recruitee, ycombinator, bamboohr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import source
        run: node ingest/import_jobhive.js "$JOBHIVE_ATS"
        env:
          JOBHIVE_ATS: ${{ matrix.ats }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
