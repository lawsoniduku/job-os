name: Posting verification regression checks
on:
  pull_request:
    paths: ['api/postingVerification.js', 'ingest/check_links.js', 'ingest/core/verification*.js', 'ingest/core/jobSignalsWriter.js', 'ingest/test_*verification*.js', 'ingest/test_job_signals_writer.js', 'supabase/migrations/*verification*', 'package*.json', '.github/workflows/verification-tests.yml']
  push:
    branches: [main]
    paths: ['api/postingVerification.js', 'ingest/check_links.js', 'ingest/core/verification*.js', 'ingest/core/jobSignalsWriter.js', 'ingest/test_*verification*.js', 'supabase/migrations/*verification*', 'package*.json', '.github/workflows/verification-tests.yml']
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:verification
