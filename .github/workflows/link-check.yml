name: Verify current job postings

# Refresh current posting content and availability, not just HTTP status.
# Unknown/blocked pages retain uncertainty labels; recheck daily.
on:
  schedule:
    - cron: "30 2 * * *"    # 02:30 UTC, before the 03:00 jobhive import
    - cron: "30 14 * * *"   # 14:30 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "How many listings to check this run"
        required: false
        default: "12000"
      source:
        description: "Optional maintained source, e.g. jobhive; leave blank for all"
        required: false
        default: ""
      recheck_days:
        description: "Recheck observations older than this many days"
        required: false
        default: "1"

concurrency:
  group: posting-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install

      - name: Check listing links
        shell: bash
        run: |
          [[ "$CHECK_LIMIT" =~ ^[1-9][0-9]*$ ]] || { echo "limit must be a positive integer"; exit 1; }
          [[ "$RECHECK_DAYS" =~ ^[1-9][0-9]*$ ]] || { echo "recheck_days must be a positive integer"; exit 1; }
          args=(--limit "$CHECK_LIMIT" --concurrency 24 --recheck-days "$RECHECK_DAYS")
          if [[ -n "$CHECK_SOURCE" ]]; then args+=(--source "$CHECK_SOURCE"); fi
          node ingest/check_links.js "${args[@]}"
        env:
          CHECK_LIMIT: ${{ inputs.limit || '12000' }}
          CHECK_SOURCE: ${{ inputs.source || '' }}
          RECHECK_DAYS: ${{ inputs.recheck_days || '1' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
