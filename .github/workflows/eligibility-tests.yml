name: Eligibility regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:eligibility
      - run: npm run test:jobhive
      - run: npm run test:search
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: job-os-ui
      - run: npm run build
        working-directory: job-os-ui
