name: Digest trust checks
on:
  pull_request:
    paths: ['ingest/send_digest.js', 'ingest/core/digest*.js', 'ingest/test_digest_trust.js', '.github/workflows/digest-trust-tests.yml']
  push:
    branches: [main]
    paths: ['ingest/send_digest.js', 'ingest/core/digest*.js', 'ingest/test_digest_trust.js', '.github/workflows/digest-trust-tests.yml']
permissions:
  contents: read
jobs:
  digest-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test ingest/test_digest_trust.js
