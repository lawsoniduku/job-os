<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>JobCopilot — Every job you see here, you can actually get</title>
    <meta name="description" content="AI job search that verifies eligibility before you see a listing. Remote jobs genuinely open to Nigeria, Kenya, Ghana and across Africa — no more region-locked dead ends." />
    <meta name="theme-color" content="#0B0E14" />
    <link rel="canonical" href="https://job-os-tau.vercel.app/" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook shares) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JobCopilot" />
    <meta property="og:title" content="JobCopilot — Every job you see here, you can actually get" />
    <meta property="og:description" content="AI job search that verifies eligibility before you see a listing. Remote jobs genuinely open to African candidates." />
    <meta property="og:url" content="https://job-os-tau.vercel.app/" />
    <meta property="og:image" content="https://job-os-tau.vercel.app/og-cover.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JobCopilot — Every job you see here, you can actually get" />
    <meta name="twitter:description" content="AI job search that verifies eligibility before you see a listing." />
    <meta name="twitter:image" content="https://job-os-tau.vercel.app/og-cover.png" />

    <!-- Structured data — tells Google what this product is -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "JobCopilot",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI job search that verifies eligibility — location rules, region locks, sponsorship — before showing a single listing.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <!-- Set theme BEFORE first paint to avoid a flash of the wrong theme.
         Default is dark; only light if the user previously chose it. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved !== "light") document.documentElement.classList.add("dark");
        } catch (e) { document.documentElement.classList.add("dark"); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
